# Sveltia CMS Configuration for Lipids & Liver Research Group
# Hosted on GitHub Pages: https://lipids-and-liver.github.io

backend:
  name: github
  repo: lipids-and-liver/lipids-and-liver.github.io
  branch: main

# Enable local proxy server when running on localhost
local_backend: true

# Site & Presentation metadata
site_url: "https://lipids-and-liver.github.io"
display_url: "https://lipids-and-liver.github.io"
logo_url: "/assets/images/logo/lipid_liver_logo.png"
locale: "es"

# Media storage
media_folder: "public/assets/images/uploads"
public_folder: "/assets/images/uploads"

# Internationalization structure (Astro multilingual collections)
i18n:
  structure: multiple_folders
  locales:
    - es
    - eu
    - en
  default_locale: es

collections:
  # ============================================================================
  # 1. BLOQUE: EL GRUPO
  # ============================================================================

  # 1.1 PRESENTACIÓN INSTITUCIONAL
  - name: "presentation"
    label: "👥 El Grupo › Presentación Institucional"
    label_singular: "Pestaña de Presentación"
    description: "Pestañas institucionales del perfil, Biocruces, SGIker e instalaciones"
    folder: "src/content/presentation"
    i18n: true
    create: true
    slug: "{{fields.id | default('{{fields.tabTitle}}')}}"
    identifier_field: "tabTitle"
    summary: "{{tabTitle}} ({{tabId}})"
    fields:
      - { label: "ID", name: "id", widget: "string", required: false, i18n: "duplicate" }
      - { label: "Título de la Pestaña", name: "tabTitle", widget: "string", i18n: true }
      - { label: "ID de la Pestaña", name: "tabId", widget: "string", i18n: "duplicate" }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int", i18n: "duplicate" }
      - { label: "Especialidades", name: "specialties", widget: "list", required: false, i18n: true }
      - { label: "Título Composición del Personal", name: "staffCompositionTitle", widget: "string", required: false, i18n: true }
      - label: "Composición del Personal"
        name: "staffComposition"
        widget: "list"
        required: false
        i18n: true
        fields:
          - { label: "Cifra / Número", name: "count", widget: "string" }
          - { label: "Puesto / Colectivo", name: "role", widget: "string" }
      - { label: "Contenido de la Presentación", name: "body", widget: "markdown", required: false, i18n: true }

  # 1.2 CARTA DE BIENVENIDA (IP)
  - name: "letter"
    label: "👥 El Grupo › Carta de Bienvenida (IP)"
    label_singular: "Carta de Presentación"
    description: "Carta de bienvenida y presentación institucional de la IP (Dra. Patricia Aspichueta) en 3 idiomas"
    folder: "src/content/letter"
    i18n: true
    create: false
    delete: false
    slug: "{{fields.id | default('carta')}}"
    identifier_field: "title"
    summary: "{{title}} - {{piName}}"
    fields:
      - { label: "ID", name: "id", widget: "string", default: "carta", i18n: "duplicate" }
      - { label: "Título de la Carta", name: "title", widget: "string", i18n: true }
      - { label: "Distintivo / Badge", name: "badge", widget: "string", i18n: true }
      - { label: "Saludo Inicial", name: "salutation", widget: "string", i18n: true }
      - { label: "Nombre de la Investigadora Principal", name: "piName", widget: "string", i18n: true }
      - { label: "Cargo Académico", name: "piRole", widget: "string", i18n: true }
      - { label: "Filiación Institucional", name: "piDept", widget: "string", i18n: true }
      - { label: "Distintivo sobre la Foto", name: "piBadgeOverlay", widget: "string", i18n: true }
      - { label: "Fotografía de la IP", name: "piImage", widget: "image", i18n: "duplicate", default: "/assets/images/team/patricia-aspichueta/image.jpg" }
      - { label: "Cargo en Firma", name: "signRole", widget: "string", required: false, i18n: true }
      - { label: "Filiación en Firma", name: "signDept", widget: "string", required: false, i18n: true }
      - { label: "Texto Enlace a CV", name: "viewCvText", widget: "string", required: false, i18n: true }
      - { label: "Ruta del CV", name: "cvLink", widget: "string", required: false, i18n: "duplicate", default: "/curriculum/patricia-aspichueta" }
      - { label: "Correo Electrónico", name: "email", widget: "string", required: false, i18n: "duplicate", default: "patricia.aspichueta@ehu.eus" }
      - { label: "ORCID", name: "orcid", widget: "string", required: false, i18n: "duplicate", default: "0000-0002-8921-9421" }
      - { label: "Cuerpo de la Carta (Texto Completo)", name: "body", widget: "markdown", required: false, i18n: true }

  # 1.3 CIFRAS CLAVE & MÉTRICAS (STATS)
  - name: "stats"
    label: "👥 El Grupo › Cifras Clave & Métricas (Stats)"
    description: "Indicadores numéricos destacados bajo la cabecera en Español, Euskera e Inglés"
    files:
      - label: "Cifras Clave del Grupo"
        name: "stats_data"
        file: "src/data/stats.json"
        format: "json"
        fields:
          - label: "Lista de Métricas (Tarjetas de la Cabecera)"
            name: "stats"
            widget: "list"
            summary: "{{fields.number}} — {{fields.label_es}}"
            fields:
              - { label: "Cifra o Texto Destacado", name: "number", widget: "string", hint: "Ej: 2007, 10+, 15+, SGIker" }
              - { label: "Etiqueta (Español)", name: "label_es", widget: "string", hint: "Ej: Grupo Consolidado" }
              - { label: "Etiketa (Euskara)", name: "label_eu", widget: "string", hint: "Ej: Talde Sendotua" }
              - { label: "Label (English)", name: "label_en", widget: "string", hint: "Ej: Consolidated Group" }
              - { label: "Subtexto (Español)", name: "subtext_es", widget: "string", hint: "Ej: Reconocido por el Gobierno Vasco" }
              - { label: "Azpitestua (Euskara)", name: "subtext_eu", widget: "string", hint: "Ej: Eusko Jaurlaritzak aitortua" }
              - { label: "Subtext (English)", name: "subtext_en", widget: "string", hint: "Ej: Recognized by the Basque Government" }

  # 1.4 PERSONAL INVESTIGADOR & CVs
  - name: "team"
    label: "👥 El Grupo › Personal Investigador & CVs"
    label_singular: "Miembro del Equipo"
    description: "Fichas de investigadores, PDI, postdocs, predocs y personal técnico con CVs"
    folder: "src/content/team"
    i18n: true
    create: true
    slug: "{{fields.id | default('{{fields.name}}')}}"
    identifier_field: "name"
    summary: "{{name}} ({{role}} - {{category}})"
    sortable_fields: ["order", "name", "category"]
    view_groups:
      - label: "Categoría del Personal"
        field: "category"
    view_filters:
      - label: "PDI & Senior"
        field: "category"
        pattern: "PDI|Investigador Senior|Investigadora Senior|Directora de Línea"
      - label: "Ramón y Cajal"
        field: "category"
        pattern: "Ramón y Cajal"
      - label: "Posdoctoral"
        field: "category"
        pattern: "Posdoctoral"
      - label: "Predoctoral"
        field: "category"
        pattern: "Predoctoral"
      - label: "Técnico"
        field: "category"
        pattern: "Técnico"
    fields:
      - { label: "Identificador (Slug)", name: "id", widget: "string", required: false, i18n: "duplicate", hint: "Opcional. Se genera automáticamente si se deja vacío (ej: ane-ortiz)" }
      - { label: "Nombre Completo", name: "name", widget: "string", required: true, i18n: "duplicate", hint: "Ej: Dr. Jon Ander Pérez" }
      - { label: "Cargo / Puesto", name: "role", widget: "string", required: false, default: "Investigador/a Predoctoral", i18n: true, hint: "Ej: Investigador Predoctoral, Posdoctoral, etc. (se traduce automáticamente si no se introduce en euskera/inglés)" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Coordinadora", "Investigadora Senior", "Investigador Senior", "Directora de Línea", "PDI", "Ramón y Cajal", "Posdoctoral", "Predoctoral", "Técnico"], default: "Predoctoral", i18n: "duplicate", hint: "Categoría para filtros del portal (se traduce automáticamente)" }
      - { label: "Departamento / Centro", name: "department", widget: "string", required: false, i18n: "duplicate", default: "Departamento de Fisiología, Facultad de Medicina y Enfermería" }
      - { label: "Fotografía", name: "image", widget: "image", required: false, i18n: "duplicate", hint: "Opcional. Si se deja vacía se muestra la silueta institucional por defecto" }
      - { label: "Correo Electrónico UPV/EHU", name: "email", widget: "string", required: false, i18n: "duplicate", hint: "Ej: nombre.apellido@ehu.eus" }
      - { label: "Teléfono", name: "phone", widget: "string", required: false, i18n: "duplicate", hint: "Ej: +34 94 601 2854" }
      - { label: "Despacho / Ubicación", name: "office", widget: "string", required: false, i18n: "duplicate", default: "Facultad de Medicina y Enfermería, Leioa" }
      - { label: "ORCID", name: "orcid", widget: "string", required: false, i18n: "duplicate", hint: "Formato: 0000-0002-XXXX-XXXX" }
      - { label: "Perfil X / Twitter", name: "x", widget: "string", required: false, i18n: "duplicate", hint: "Ej: @usuario o https://x.com/usuario" }
      - { label: "Perfil LinkedIn", name: "linkedin", widget: "string", required: false, i18n: "duplicate", hint: "Ej: https://linkedin.com/in/usuario" }
      - { label: "Perfil GitHub", name: "github", widget: "string", required: false, i18n: "duplicate", hint: "Ej: https://github.com/usuario" }
      - { label: "Cita(s) (Opcional)", name: "quote", widget: "list", required: false, i18n: "duplicate", hint: "Añade una o varias citas inspiradoras" }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int", i18n: "duplicate" }
      - label: "Currículum Vitae Detallado"
        name: "cv"
        widget: "object"
        required: false
        i18n: "duplicate"
        fields:
          - { label: "Título Profesional CV", name: "title", widget: "string", required: false, hint: "Ej: Investigador/a en Formación" }
          - { label: "Titulaciones Académicas", name: "degrees", widget: "list", required: false, hint: "Ej: Grado en Bioquímica (UPV/EHU, 2023)" }
          - { label: "Formación Continua y Cursos", name: "otherTraining", widget: "list", required: false, hint: "Ej: Acreditación animalario (Funciones B y C), Cursos de especialización técnica, bioinformática, etc." }
          - { label: "Puestos y Trayectoria Previa", name: "positions", widget: "list", required: false, hint: "Ej: Investigador en formación (2024-Presente)" }
          - { label: "Proyectos y Financiación", name: "grants", widget: "list", required: false, hint: "Ej: Contrato Predoctoral Gobierno Vasco (2024-2028)" }
          - { label: "Publicaciones Relevantes", name: "publications", widget: "list", required: false, hint: "Citas destacadas" }
          - { label: "Patentes y Propiedad Industrial", name: "patents", widget: "list", required: false, hint: "Patentes de invención o registros OEPM" }
          - { label: "Docencia Universitaria", name: "teaching", widget: "list", required: false, hint: "Docencia de Grado o Prácticas" }
      - { label: "Semblanza / Biografía Breve", name: "body", widget: "markdown", required: false, i18n: true, default: "Investigador/a en el Departamento de Fisiología de la Facultad de Medicina y Enfermería de la UPV/EHU e integrante del Grupo Lipids & Liver." }

  # 1.5 ANTIGUOS MIEMBROS
  - name: "alumni"
    label: "👥 El Grupo › Antiguos Miembros"
    description: "Directorio histórico de investigadores y doctores vinculados al grupo"
    files:
      - label: "Directorio de Antiguos Miembros"
        name: "alumni_data"
        file: "src/data/alumni.json"
        format: "json"
        fields:
          - label: "Lista de Antiguos Miembros"
            name: "alumni"
            widget: "list"
            summary: "{{fields.name}} ({{fields.period}})"
            fields:
              - { label: "ID / Slug", name: "id", widget: "string" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Periodo en el Grupo", name: "period", widget: "string", hint: "Ej: 2010 – 2015" }
              - { label: "Rol en el Laboratorio", name: "labRole", widget: "string", hint: "Ej: Investigadora Predoctoral, Catedrática de Universidad" }
              - { label: "Rol / Título Académico", name: "role", widget: "string", required: false, hint: "Ej: Catedrática Emérita de Bioquímica y Biología Molecular" }
              - { label: "ID de Tesis en la Web", name: "thesisId", widget: "string", required: false, hint: "Ej: tesis-10, tesis-25" }
              - { label: "Título de la Tesis", name: "thesis", widget: "string", required: false }
              - { label: "Año de Tesis / Egreso", name: "year", widget: "string", required: false }
              - { label: "Puesto Actual", name: "currentRole", widget: "string" }
              - { label: "Afiliación / Centro Actual", name: "currentAffiliation", widget: "string" }
              - { label: "Ubicación Geográfica", name: "location", widget: "string" }
              - label: "Categoría"
                name: "category"
                widget: "select"
                options:
                  - { label: "Academia & Investigación", value: "academia" }
                  - { label: "Industria & Biotecnología", value: "industry" }
                  - { label: "Investigación Clínica", value: "clinical" }
                  - { label: "Cofundadora & Emérita", value: "emerita" }
              - { label: "Etiqueta de Categoría", name: "categoryLabel", widget: "string" }
              - { label: "¿Es Cofundadora / Honorífico?", name: "isFounder", widget: "boolean", default: false, required: false }
              - { label: "Tesis Dirigidas (Números)", name: "thesesSupervised", widget: "list", required: false, hint: "Números de tesis dirigidas, ej: 29, 31" }
              - { label: "Patente Asociada", name: "patent", widget: "string", required: false, hint: "Ej: P201831028 (OEPM)" }
              - { label: "Descripción / Semblanza", name: "description", widget: "text", required: false }
              - { label: "URL Portal Producción UPV/EHU", name: "ehuUrl", widget: "string", required: false, hint: "https://ekoizpen-zientifikoa.ehu.eus/investigadores/.../detalle" }
              - { label: "Icono FontAwesome", name: "icon", widget: "string", default: "fas fa-user-graduate", required: false }
              - { label: "Enlace LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Enlace ORCID", name: "orcid", widget: "string", required: false }

  # ============================================================================
  # 2. BLOQUE: INVESTIGACIÓN
  # ============================================================================

  # 2.1 LÍNEAS DE INVESTIGACIÓN
  - name: "research"
    label: "🔬 Investigación › Líneas Prioritarias"
    label_singular: "Línea de Investigación"
    description: "Proyectos científicos y líneas prioritarias del grupo"
    folder: "src/content/research"
    i18n: true
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{title}} ({{badge}})"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Identificador (Slug)", name: "id", widget: "string", required: false, i18n: "duplicate", hint: "Ej: mafld, cancer, spatial-omics" }
      - { label: "Título de la Línea", name: "title", widget: "string", i18n: true }
      - { label: "Descripción Breve", name: "shortDesc", widget: "text", i18n: true }
      - { label: "Imagen Representativa", name: "image", widget: "image", i18n: "duplicate" }
      - { label: "Insignia / Badge", name: "badge", widget: "string", i18n: true }
      - { label: "Filiación y Financiación", name: "affiliation", widget: "text", required: false, i18n: true }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int", i18n: "duplicate" }
      - { label: "Objetivos Científicos y Memoria Extensa", name: "body", widget: "markdown", required: false, i18n: true }

  # 2.2 PROYECTOS COMPETITIVOS
  - name: "projects"
    label: "🔬 Investigación › Proyectos Competitivos"
    label_singular: "Proyecto"
    description: "Proyectos financiados del Plan Nacional, Gobierno Vasco, FEDER y Fundaciones"
    folder: "src/content/projects"
    i18n: false
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{title}} [{{code}}] ({{status}})"
    sortable_fields: ["order", "period", "status"]
    view_groups:
      - label: "Estado del Proyecto"
        field: "status"
      - label: "Ámbito de Convocatoria"
        field: "fundingType"
    view_filters:
      - label: "Proyectos Activos"
        field: "status"
        pattern: "active"
      - label: "Proyectos Finalizados"
        field: "status"
        pattern: "completed"
    fields:
      - { label: "Identificador (Slug)", name: "id", widget: "string", required: false, hint: "Ej: pid2021-mafld" }
      - { label: "Título del Proyecto", name: "title", widget: "string" }
      - { label: "Acrónimo", name: "acronym", widget: "string", required: false, hint: "Ej: AGPAE, ONCOFINDER, SHEIC" }
      - { label: "Código / Expediente", name: "code", widget: "string" }
      - { label: "Entidad Financiadora", name: "fundingBody", widget: "string" }
      - { label: "Ámbito de Convocatoria", name: "fundingType", widget: "select", options: [{ label: "Nacional (MICINN / ISCIII)", value: "national" }, { label: "Regional (Gobierno Vasco)", value: "regional" }, { label: "Europeo (Horizon / FEDER)", value: "european" }, { label: "Fundación (AECC, etc.)", value: "foundation" }] }
      - { label: "Investigadora Principal", name: "pi", widget: "string", default: "Dra. Patricia Aspichueta" }
      - { label: "Periodo de Ejecución", name: "period", widget: "string", hint: "Ej: 2022 - 2025" }
      - { label: "Año de Fin / Referencia", name: "year", widget: "number", required: false, value_type: "int", hint: "Ej: 2027" }
      - { label: "Estado", name: "status", widget: "select", options: [{ label: "Activo", value: "active" }, { label: "Finalizado", value: "completed" }] }
      - { label: "Ámbito Territorial", name: "scope", widget: "string", required: false, hint: "Ej: Regional, Estatal, Europeo" }
      - { label: "Convocatoria Específica", name: "call", widget: "string", required: false, hint: "Ej: Proyectos I+D+i 2021" }
      - { label: "Presupuesto / Programa", name: "budget", widget: "string", required: false }
      - { label: "Insignia", name: "badge", widget: "string", required: false }
      - { label: "Resumen Breve", name: "summary", widget: "text", required: false }
      - { label: "URL Oficial Ficha UPV/EHU", name: "officialUrl", widget: "string", required: false, hint: "URL a ekoizpen-zientifikoa.ehu.eus" }
      - { label: "Investigadores Participantes", name: "researchers", widget: "list", required: false, hint: "Lista de investigadores del proyecto" }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int" }
      - { label: "Memoria y Objetivos del Proyecto", name: "body", widget: "markdown", required: false }

  # 2.3 PUBLICACIONES CIENTÍFICAS JCR
  - name: "publications"
    label: "🔬 Investigación › Publicaciones JCR"
    label_singular: "Publicación"
    description: "Catálogo de artículos en revistas de alto impacto con DOI"
    folder: "src/content/publications/es"
    i18n: false
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{year}}: {{title}} ({{journal}})"
    sortable_fields: ["year", "title", "topic"]
    view_groups:
      - label: "Área Temática"
        field: "topic"
      - label: "Año de Publicación"
        field: "year"
    view_filters:
      - label: "MAFLD / MASLD"
        field: "topic"
        pattern: "mafld"
      - label: "Cáncer Hepático"
        field: "topic"
        pattern: "cancer"
      - label: "Ómicas Espaciales"
        field: "topic"
        pattern: "spatial-omics"
      - label: "Ciclo Celular E2F"
        field: "topic"
        pattern: "e2f"
      - label: "Exposoma"
        field: "topic"
        pattern: "exposome"
      - label: "Lipidómica"
        field: "topic"
        pattern: "lipidomics"
    fields:
      - { label: "ID", name: "id", widget: "string", required: false, hint: "Ej: pub-001" }
      - { label: "Año", name: "year", widget: "string", hint: "Ej: 2026" }
      - { label: "Título del Artículo", name: "title", widget: "string" }
      - { label: "Autores", name: "authors", widget: "text" }
      - { label: "Revista Científica", name: "journal", widget: "string" }
      - { label: "Área Temática", name: "topic", widget: "select", options: [{ label: "MAFLD / MASLD", value: "mafld" }, { label: "Cáncer Hepático", value: "cancer" }, { label: "Ómicas Espaciales", value: "spatial-omics" }, { label: "Ciclo Celular E2F", value: "e2f" }, { label: "Esposoma", value: "exposome" }, { label: "Lipidómica", value: "lipidomics" }] }
      - { label: "DOI (Identificador)", name: "doi", widget: "string", required: false, hint: "Ej: 10.1080/19490976.2026.2631834" }
      - { label: "Abstract / Resumen", name: "body", widget: "markdown", required: false }

  # 2.4 TESIS DOCTORALES
  - name: "theses"
    label: "🔬 Investigación › Tesis Doctorales"
    label_singular: "Tesis Doctoral"
    description: "Repositorio de tesis doctorales defendidas y en curso de realización"
    folder: "src/content/theses"
    i18n: true
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{title}} ({{author}} - {{year}})"
    sortable_fields: ["order", "year", "author", "status"]
    view_groups:
      - label: "Estado de la Tesis"
        field: "status"
    view_filters:
      - label: "Tesis en Curso"
        field: "status"
        pattern: "ongoing"
      - label: "Tesis Defendidas"
        field: "status"
        pattern: "completed"
    fields:
      - { label: "Identificador (Slug)", name: "id", widget: "string", required: false, i18n: "duplicate", hint: "Ej: tesis-16" }
      - { label: "Doctorando/a (Autor)", name: "author", widget: "string", i18n: "duplicate" }
      - { label: "Estado", name: "status", widget: "select", options: [{ label: "En Curso", value: "ongoing" }, { label: "Defendida", value: "completed" }], i18n: "duplicate" }
      - { label: "Título de la Tesis", name: "title", widget: "string", i18n: true }
      - { label: "Institución", name: "institution", widget: "string", default: "UPV/EHU - Departamento de Fisiología", i18n: true }
      - { label: "Año / Periodo", name: "year", widget: "string", i18n: true, hint: "Ej: 2025 o 'En desarrollo (2024-2027)'" }
      - { label: "Insignia / Badge", name: "badge", widget: "string", required: false, i18n: true, hint: "Ej: En Curso, Cum Laude, Mención Internacional" }
      - { label: "Directores de Tesis", name: "directors", widget: "list", required: false, i18n: "duplicate" }
      - { label: "Programa de Doctorado", name: "program", widget: "string", required: false, i18n: true, default: "Programa de Doctorado en Biomedicina" }
      - { label: "Departamento", name: "department", widget: "string", required: false, i18n: true, default: "Departamento de Fisiología" }
      - { label: "Universidad", name: "university", widget: "string", required: false, i18n: true, default: "UPV/EHU" }
      - { label: "Fecha de Defensa", name: "defenseDate", widget: "string", required: false, i18n: "duplicate", hint: "Ej: 14/07/2023 o 2023-07-14" }
      - { label: "Palabras Clave", name: "keywords", widget: "list", required: false, i18n: true }
      - { label: "Enlace Oficial UPV/EHU", name: "officialUrl", widget: "string", required: false, i18n: "duplicate", hint: "Enlace a ekoizpen-zientifikoa.ehu.eus" }
      - { label: "Identificador Handle (ADDI)", name: "handleUrl", widget: "string", required: false, i18n: "duplicate", hint: "Ej: https://hdl.handle.net/10810/XXXXX" }
      - { label: "Ficha Dialnet", name: "dialnetUrl", widget: "string", required: false, i18n: "duplicate", hint: "Ej: https://dialnet.unirioja.es/servlet/tesis?codigo=XXXXX" }
      - { label: "Identificador TESEO", name: "teseoId", widget: "string", required: false, i18n: "duplicate", hint: "Código TESEO del Ministerio" }
      - { label: "Orden de Aparición", name: "order", widget: "number", default: 99, value_type: "int", i18n: "duplicate" }
      - { label: "Resumen / Abstract", name: "body", widget: "markdown", required: false, i18n: true }

  # 2.5 PROPIEDAD INDUSTRIAL & PATENTES
  - name: "patents"
    label: "🔬 Investigación › Propiedad Industrial & Patentes"
    label_singular: "Patente"
    description: "Patentes de invención, registros OEPM y transferencia de tecnología"
    folder: "src/content/patents"
    i18n: true
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{title}} [{{publicationNumber}}] ({{year}})"
    sortable_fields: ["order", "year", "title"]
    fields:
      - { label: "Identificador (Slug)", name: "id", widget: "string", required: false, i18n: "duplicate", hint: "Ej: p201831028-lipidos-lagrima" }
      - { label: "Título de la Invención", name: "title", widget: "string", i18n: true }
      - { label: "Número de Solicitud", name: "applicationNumber", widget: "string", i18n: "duplicate", hint: "Ej: P201831028" }
      - { label: "Número de Publicación", name: "publicationNumber", widget: "string", i18n: "duplicate", hint: "Ej: ES2755963A1" }
      - { label: "Año de Publicación", name: "year", widget: "number", default: 2020, value_type: "int", i18n: "duplicate" }
      - { label: "Fecha de Solicitud", name: "applicationDate", widget: "string", required: false, i18n: "duplicate", hint: "Formato: YYYY-MM-DD" }
      - { label: "Fecha de Publicación", name: "publicationDate", widget: "string", required: false, i18n: "duplicate", hint: "Formato: YYYY-MM-DD" }
      - { label: "Entidad Titular", name: "applicant", widget: "string", default: "Universidad del País Vasco / Euskal Herriko Unibertsitatea (UPV/EHU)", i18n: true }
      - { label: "Inventores", name: "inventors", widget: "list", i18n: "duplicate" }
      - { label: "Inventores del Grupo Lipids & Liver", name: "groupInventors", widget: "list", required: false, i18n: "duplicate", hint: "Nombres de los miembros del grupo para destacarlos" }
      - { label: "Ámbito Territorial", name: "scope", widget: "string", default: "Nacional (España - OEPM)", i18n: true }
      - { label: "Estado", name: "status", widget: "string", default: "Concedida / Publicada (A1)", i18n: true }
      - { label: "Insignia / Badge", name: "badge", widget: "string", default: "Patente OEPM", i18n: true }
      - { label: "Resumen Oficial", name: "abstract", widget: "text", required: false, i18n: true }
      - { label: "Enlace INVENES (OEPM)", name: "invenesUrl", widget: "string", required: false, i18n: "duplicate", hint: "URL base INVENES OEPM" }
      - { label: "Enlace Documento PDF (OEPM)", name: "pdfUrl", widget: "string", required: false, i18n: "duplicate", hint: "URL descarga directa PDF OEPM" }
      - { label: "Enlace Ficha UPV/EHU", name: "ehuUrl", widget: "string", required: false, i18n: "duplicate", hint: "URL portal producción científica UPV/EHU" }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int", i18n: "duplicate" }
      - { label: "Memoria y Aplicabilidad Clínica", name: "body", widget: "markdown", required: false, i18n: true }

  # ============================================================================
  # 3. BLOQUE: FORMACIÓN & TALENTO
  # ============================================================================

  # 3.1 DOCENCIA UNIVERSITARIA Y FORMACIÓN
  - name: "training"
    label: "🎓 Formación › Docencia Universitaria"
    label_singular: "Actividad Formativa"
    description: "Docencia reglada en Grados, Másteres Universitarios y Doctorado"
    folder: "src/content/training"
    i18n: true
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{title}} ({{type}})"
    sortable_fields: ["order", "type"]
    view_groups:
      - label: "Nivel Formativo"
        field: "type"
    fields:
      - { label: "ID", name: "id", widget: "string", required: false, i18n: "duplicate" }
      - { label: "Título de la Asignatura / Módulo", name: "title", widget: "string", i18n: true }
      - { label: "Tipo / Nivel", name: "type", widget: "string", i18n: true, hint: "Ej: Grado, Máster Oficial, Doctorado" }
      - { label: "Insignia", name: "badge", widget: "string", required: false, i18n: true }
      - { label: "Institución", name: "institution", widget: "string", required: false, i18n: true, default: "UPV/EHU" }
      - { label: "Enlace Oficial", name: "url", widget: "string", required: false, i18n: "duplicate" }
      - { label: "Icono FontAwesome", name: "icon", widget: "string", required: false, i18n: "duplicate", hint: "Ej: fas fa-microscope" }
      - { label: "Diseño Tarjeta (Bento Span)", name: "bentoSpan", widget: "select", options: [{ label: "Compacto (1 col)", value: "compact" }, { label: "Ancho (2 cols)", value: "wide" }, { label: "Completo (3 cols)", value: "full" }], default: "compact", required: false, i18n: "duplicate" }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int", i18n: "duplicate" }
      - { label: "Descripción", name: "body", widget: "markdown", required: false, i18n: true }

  # ============================================================================
  # 4. BLOQUE: COMUNICACIÓN & NOTICIAS
  # ============================================================================

  # 4.1 NOTICIAS Y HITOS
  - name: "news"
    label: "📰 Noticias › Novedades & Hitos"
    label_singular: "Noticia"
    description: "Noticias de divulgación, congresos, tesis y hitos del laboratorio"
    folder: "src/content/news"
    i18n: false
    create: true
    slug: "{{fields.id | default('{{fields.title}}')}}"
    identifier_field: "title"
    summary: "{{title}} ({{date}} - {{category}})"
    sortable_fields: ["date", "order", "category"]
    view_groups:
      - label: "Categoría de Noticia"
        field: "category"
    view_filters:
      - label: "Noticias Destacadas"
        field: "featured"
        pattern: true
    fields:
      - { label: "Identificador (Slug)", name: "id", widget: "string", required: false, hint: "Ej: easl-congress-milan" }
      - { label: "Titular de la Noticia", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", type: "date", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Congresos", "Publicaciones", "Acreditación", "Tesis", "Divulgación", "Premios"] }
      - { label: "Insignia de Categoría", name: "categoryBadge", widget: "string", required: false }
      - { label: "Resumen Breve", name: "summary", widget: "text" }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Autor/a", name: "author", widget: "string", default: "Grupo Lipids & Liver" }
      - { label: "Enlace Externo (Opcional)", name: "link", widget: "string", required: false }
      - { label: "Destacada en Portada", name: "featured", widget: "boolean", default: false }
      - { label: "Orden", name: "order", widget: "number", default: 99, value_type: "int" }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown", required: false }

  # ============================================================================
  # 5. BLOQUE: RED & ALIANZAS
  # ============================================================================

  # 5.1 CENTROS COLABORADORES
  - name: "collaborations"
    label: "⚙️ Red & Alianzas › Centros Colaboradores"
    description: "Hospitales, centros de investigación, universidades y consorcios"
    files:
      - label: "Centros Colaboradores"
        name: "collaborations_data"
        file: "src/data/collaborations.json"
        format: "json"
        fields:
          - label: "Lista de Colaboraciones"
            name: "collaborations"
            widget: "list"
            summary: "{{fields.name}} ({{fields.type}})"
            fields:
              - { label: "ID / Slug", name: "id", widget: "string" }
              - { label: "Nombre de la Institución", name: "name", widget: "string" }
              - { label: "Tipo / Categoría", name: "type", widget: "string" }
              - { label: "Rol / Área de Alianza", name: "role", widget: "string" }
              - { label: "Ubicación Geográfica", name: "location", widget: "string" }
              - { label: "Icono FontAwesome", name: "icon", widget: "string", default: "fas fa-university" }
              - { label: "Sitio Web Oficial", name: "url", widget: "string", required: false }
              - { label: "Descripción / Alcance", name: "desc", widget: "text", required: false }

  # ============================================================================
  # 6. BLOQUE: MODELOS Y PLANTILLAS DE EJEMPLO
  # ============================================================================
  - name: "templates"
    label: "📋 Modelos & Plantillas de Referencia"
    description: "Plantillas oficiales editables para consultar o duplicar al dar de alta nuevos datos"
    files:
      - label: "Plantilla › Ficha de Miembro del Equipo"
        name: "template_team"
        file: "src/content/templates/_plantilla_miembro.md"
        fields:
          - { label: "ID / Slug", name: "id", widget: "string", default: "nombre-apellido" }
          - { label: "Nombre Completo", name: "name", widget: "string", default: "Dr. Nombre Apellido" }
          - { label: "Cargo / Puesto", name: "role", widget: "string", default: "Investigador/a Predoctoral" }
          - { label: "Categoría", name: "category", widget: "select", options: ["Coordinadora", "Investigadora Senior", "Investigador Senior", "Directora de Línea", "PDI", "Ramón y Cajal", "Posdoctoral", "Predoctoral", "Técnico"], default: "Predoctoral" }
          - { label: "Departamento", name: "department", widget: "string", default: "Departamento de Fisiología, Facultad de Medicina y Enfermería" }
          - { label: "Correo Electrónico", name: "email", widget: "string", default: "nombre.apellido@ehu.eus" }
          - { label: "Despacho", name: "office", widget: "string", default: "Facultad de Medicina y Enfermería, Leioa" }
          - { label: "ORCID", name: "orcid", widget: "string", default: "0000-0000-0000-0000" }
          - { label: "Orden", name: "order", widget: "number", default: 99 }
          - label: "Currículum Vitae"
            name: "cv"
            widget: "object"
            fields:
              - { label: "Título CV", name: "title", widget: "string", default: "Investigador/a - Grupo Lipids & Liver" }
              - { label: "Titulaciones Académicas", name: "degrees", widget: "list" }
              - { label: "Puestos y Trayectoria", name: "positions", widget: "list" }
              - { label: "Proyectos y Financiación", name: "grants", widget: "list" }
              - { label: "Publicaciones Relevantes", name: "publications", widget: "list" }
              - { label: "Patentes y Propiedad Industrial", name: "patents", widget: "list" }
              - { label: "Docencia Universitaria", name: "teaching", widget: "list" }
          - { label: "Semblanza / Perfil", name: "body", widget: "markdown" }

      - label: "Plantilla › Tesis Doctoral"
        name: "template_thesis"
        file: "src/content/templates/_plantilla_tesis.md"
        fields:
          - { label: "ID / Slug", name: "id", widget: "string", default: "tesis-nueva" }
          - { label: "Doctorando/a", name: "author", widget: "string", default: "Nombre del Doctorando" }
          - { label: "Estado", name: "status", widget: "select", options: [{ label: "En Curso", value: "ongoing" }, { label: "Defendida", value: "completed" }], default: "ongoing" }
          - { label: "Título de la Tesis", name: "title", widget: "string", default: "Título oficial de la Tesis Doctoral" }
          - { label: "Institución", name: "institution", widget: "string", default: "UPV/EHU - Departamento de Fisiología" }
          - { label: "Año / Periodo", name: "year", widget: "string", default: "2025-2028" }
          - { label: "Insignia / Badge", name: "badge", widget: "string", default: "En Curso" }
          - { label: "Directores de Tesis", name: "directors", widget: "list" }
          - { label: "Programa de Doctorado", name: "program", widget: "string", default: "Programa de Doctorado en Biomedicina" }
          - { label: "Fecha de Defensa", name: "defenseDate", widget: "string", required: false }
          - { label: "Palabras Clave", name: "keywords", widget: "list" }
          - { label: "Enlace Oficial UPV/EHU", name: "officialUrl", widget: "string", required: false }
          - { label: "Identificador Handle (ADDI)", name: "handleUrl", widget: "string", required: false }
          - { label: "Ficha Dialnet", name: "dialnetUrl", widget: "string", required: false }
          - { label: "Identificador TESEO", name: "teseoId", widget: "string", required: false }
          - { label: "Orden", name: "order", widget: "number", default: 99 }
          - { label: "Resumen", name: "body", widget: "markdown" }

      - label: "Plantilla › Proyecto de Investigación"
        name: "template_project"
        file: "src/content/templates/_plantilla_proyecto.md"
        fields:
          - { label: "ID / Slug", name: "id", widget: "string", default: "codigo-proyecto" }
          - { label: "Título del Proyecto", name: "title", widget: "string", default: "Título del Proyecto" }
          - { label: "Acrónimo", name: "acronym", widget: "string", required: false }
          - { label: "Código / Expediente", name: "code", widget: "string", default: "PID202X-XXXXXX-XX" }
          - { label: "Entidad Financiadora", name: "fundingBody", widget: "string", default: "Ministerio de Ciencia e Innovación" }
          - { label: "Ámbito de Convocatoria", name: "fundingType", widget: "select", options: [{ label: "Nacional (MICINN / ISCIII)", value: "national" }, { label: "Regional (Gobierno Vasco)", value: "regional" }, { label: "Europeo (Horizon / FEDER)", value: "european" }, { label: "Fundación (AECC, etc.)", value: "foundation" }], default: "national" }
          - { label: "Investigadora Principal", name: "pi", widget: "string", default: "Dra. Patricia Aspichueta Celaá" }
          - { label: "Periodo", name: "period", widget: "string", default: "2024 - 2027" }
          - { label: "Año de Fin", name: "year", widget: "number", default: 2027 }
          - { label: "Estado", name: "status", widget: "select", options: [{ label: "Activo", value: "active" }, { label: "Finalizado", value: "completed" }], default: "active" }
          - { label: "Presupuesto", name: "budget", widget: "string", default: "150.000 €" }
          - { label: "Insignia", name: "badge", widget: "string", default: "Plan Estatal I+D+i" }
          - { label: "Ámbito", name: "scope", widget: "string", default: "Estatal" }
          - { label: "Convocatoria", name: "call", widget: "string", required: false }
          - { label: "Enlace Oficial UPV/EHU", name: "officialUrl", widget: "string", required: false }
          - { label: "Investigadores", name: "researchers", widget: "list", required: false }
          - { label: "Orden", name: "order", widget: "number", default: 10 }
          - { label: "Resumen y Memoria", name: "body", widget: "markdown" }

      - label: "Plantilla › Patente de Invención"
        name: "template_patent"
        file: "src/content/templates/_plantilla_patente.md"
        fields:
          - { label: "ID / Slug", name: "id", widget: "string", default: "p202X-titulo" }
          - { label: "Título de la Invención", name: "title", widget: "string", default: "Título oficial de la Patente" }
          - { label: "Nº Solicitud", name: "applicationNumber", widget: "string", default: "P202XXXXXX" }
          - { label: "Nº Publicación", name: "publicationNumber", widget: "string", default: "ES2XXXXXXA1" }
          - { label: "Año", name: "year", widget: "number", default: 2025 }
          - { label: "Fecha Solicitud", name: "applicationDate", widget: "string", default: "2024-05-15" }
          - { label: "Fecha Publicación", name: "publicationDate", widget: "string", default: "2025-11-20" }
          - { label: "Titular", name: "applicant", widget: "string", default: "Universidad del País Vasco / Euskal Herriko Unibertsitatea (UPV/EHU)" }
          - { label: "Inventores", name: "inventors", widget: "list" }
          - { label: "Inventores Lipids & Liver", name: "groupInventors", widget: "list", required: false }
          - { label: "Ámbito", name: "scope", widget: "string", default: "Nacional (España - OEPM)" }
          - { label: "Estado", name: "status", widget: "string", default: "Concedida / Publicada (A1)" }
          - { label: "Insignia", name: "badge", widget: "string", default: "Patente OEPM" }
          - { label: "Resumen", name: "abstract", widget: "text" }
          - { label: "Enlace INVENES", name: "invenesUrl", widget: "string", required: false }
          - { label: "Enlace PDF", name: "pdfUrl", widget: "string", required: false }
          - { label: "Enlace Ficha UPV/EHU", name: "ehuUrl", widget: "string", required: false }
          - { label: "Orden", name: "order", widget: "number", default: 1 }
          - { label: "Memoria Descriptiva", name: "body", widget: "markdown" }

      - label: "Plantilla › Publicación Científica"
        name: "template_pub"
        file: "src/content/templates/_plantilla_publicacion.md"
        fields:
          - { label: "Año", name: "year", widget: "string", default: "2026" }
          - { label: "Título del Artículo", name: "title", widget: "string" }
          - { label: "Autores", name: "authors", widget: "text" }
          - { label: "Revista Científica", name: "journal", widget: "string" }
          - { label: "Área Temática", name: "topic", widget: "select", options: [{ label: "MAFLD / MASLD", value: "mafld" }, { label: "Cáncer Hepático", value: "cancer" }, { label: "Ómicas Espaciales", value: "spatial-omics" }, { label: "Ciclo Celular E2F", value: "e2f" }, { label: "Exposoma", value: "exposome" }, { label: "Lipidómica", value: "lipidomics" }] }
          - { label: "DOI", name: "doi", widget: "string" }
          - { label: "Abstract / Resumen", name: "body", widget: "markdown" }
