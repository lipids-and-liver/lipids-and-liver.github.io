<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dossier de Currículums | Lipids & Liver (Prototipo 3 - Editorial Suizo)</title>
  <meta name="description" content="Dossier académico y perfil investigador del personal del Grupo Lipids & Liver (UPV/EHU & Biocruces)." />

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Editorial Stylesheet -->
  <link rel="stylesheet" href="assets/css/editorial.css" />
</head>
<body>

  <!-- Top Prototype Switcher Strip -->
  <div class="ed-switcher-bar">
    <div class="container ed-switcher-inner">
      <div>
        <i class="fas fa-university"></i> UPV/EHU &bull; IIS Biocruces Bizkaia &bull; Facultad de Medicina y Enfermería
      </div>
      <div>
        <span style="font-size:0.75rem; font-family:var(--ed-font-mono); color:var(--ed-ink-secondary);">IT1560-22 &bull; DEPARTAMENTO DE FISIOLOGÍA</span>
      </div>
    </div>
  </div>

  <!-- Editorial Masthead Header -->
  <header class="ed-masthead">
    <div class="container">
      <div class="ed-masthead-top">
        <div class="ed-brand-group">
          <img src="assets/images/logo/ehu_logo_positiboa.svg" alt="UPV/EHU" class="ed-ehu-logo" id="ed-ehu-logo" />
          <div style="width:1px; height:32px; background:var(--ed-border);"></div>
          <img src="assets/images/logo/lipid_liver_logo.png" alt="Lipids & Liver" class="ed-brand-logo" />
          <div class="ed-brand-titles">
            <span class="ed-brand-main">Lipids &amp; Liver</span>
            <span class="ed-brand-sub">Dossier Académico de Investigadores</span>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:16px;">
          <!-- Dropdown selector -->
          <div style="display:flex; align-items:center; gap:8px;">
            <label for="member-select" style="font-size:0.8rem; font-weight:700; text-transform:uppercase;">Investigador/a:</label>
            <select id="member-select" style="padding:6px 12px; border:1px solid var(--ed-border); font-family:var(--font-sans); font-size:0.85rem; background:var(--ed-surface); color:var(--ed-ink-primary); cursor:pointer;">
              <!-- Populated dynamically -->
            </select>
          </div>

          <a href="index.html" class="btn-ed-outline" style="padding:6px 14px; font-size:0.8rem;">
            <i class="fas fa-arrow-left"></i> Volver al Inicio
          </a>
          <button class="ed-theme-btn" id="theme-toggle-btn" title="Alternar tema">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="cv-editorial-container" style="padding: 3rem 2rem 5rem;">
    <!-- Populated dynamically -->
  </main>

  <footer class="ed-footer">
    <div class="container ed-footer-bottom" style="margin-top:0; padding-top:0; border-top:none;">
      <div>&copy; 2026 Grupo de Investigación Lipids &amp; Liver &bull; UPV/EHU &bull; IIS Biocruces Bizkaia</div>
      <div>Dossier Oficial de Investigadores</div>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('member-select');
      const container = document.getElementById('cv-editorial-container');
      const themeBtn = document.getElementById('theme-toggle-btn');
      const logo = document.getElementById('ed-ehu-logo');

      function updateTheme(theme) {
        if (themeBtn) {
          const icon = themeBtn.querySelector('i');
          if (icon) icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        if (logo) {
          logo.src = theme === 'dark' 
            ? 'assets/images/logo/ehu_logo_negatiboa.svg'
            : 'assets/images/logo/ehu_logo_positiboa.svg';
        }
      }

      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateTheme(savedTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateTheme(next);
        });
      }

      APP_DATA.teamMembers.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = `${m.name} (${m.category})`;
        select.appendChild(opt);
      });

      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('id') || APP_DATA.teamMembers[0].id;
      select.value = urlId;
      renderEditorialCV(urlId);

      select.addEventListener('change', (e) => {
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + e.target.value;
        window.history.pushState({path: newUrl}, '', newUrl);
        renderEditorialCV(e.target.value);
      });

      function renderEditorialCV(id) {
        const member = APP_DATA.teamMembers.find(m => m.id === id) || APP_DATA.teamMembers[0];
        const cv = member.cv || {};

        container.innerHTML = `
          <div style="display:grid; grid-template-columns: 240px 1fr; gap:3rem; padding-bottom:3rem; border-bottom:1px solid var(--ed-border); margin-bottom:3rem;">
            <div>
              <img src="${member.image}" alt="${member.name}" style="width:100%; height:280px; object-fit:cover; border:1px solid var(--ed-border);" />
              <div style="margin-top:1rem; font-size:0.85rem; color:var(--ed-ink-muted);">
                <div><strong>ORCID:</strong> <a href="https://orcid.org/${member.orcid || ''}" target="_blank" rel="noopener" style="color:var(--ed-accent);">${member.orcid || 'N/A'}</a></div>
                <div style="margin-top:4px;"><strong>Email:</strong> <a href="mailto:${member.email}" style="color:var(--ed-ink-primary);">${member.email}</a></div>
                <div style="margin-top:4px;"><strong>Despacho:</strong> ${member.office || 'Facultad de Medicina, Leioa'}</div>
              </div>
            </div>

            <div>
              <span class="ed-eyebrow">${member.category} &bull; ${member.department}</span>
              <h1 style="font-family:var(--font-serif); font-size:2.8rem; font-weight:400; line-height:1.15; margin-bottom:0.75rem; color:var(--ed-ink-primary);">${member.name}</h1>
              <div style="font-size:1.15rem; color:var(--ed-accent); font-weight:600; margin-bottom:1.5rem;">${cv.title || member.role}</div>
              <p style="font-size:1.1rem; line-height:1.8; color:var(--ed-ink-secondary);">${member.bio || ''}</p>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:3rem;">
            ${cv.degrees ? `
            <div>
              <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--ed-border); padding-bottom:0.5rem;">
                Titulación y Formación Académica
              </h3>
              <ul style="list-style:none; display:flex; flex-direction:column; gap:10px; color:var(--ed-ink-secondary);">
                ${cv.degrees.map(d => `<li>&bull; ${d}</li>`).join('')}
              </ul>
            </div>
            ` : ''}

            ${cv.positions ? `
            <div>
              <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--ed-border); padding-bottom:0.5rem;">
                Cargos Académicos e Institucionales
              </h3>
              <ul style="list-style:none; display:flex; flex-direction:column; gap:10px; color:var(--ed-ink-secondary);">
                ${cv.positions.map(p => `<li>&bull; ${p}</li>`).join('')}
              </ul>
            </div>
            ` : ''}

            ${cv.researchSummary ? `
            <div>
              <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--ed-border); padding-bottom:0.5rem;">
                Resumen de Actividad Investigadora
              </h3>
              <p style="color:var(--ed-ink-secondary); line-height:1.8; font-size:1.05rem;">${cv.researchSummary}</p>
            </div>
            ` : ''}

            ${cv.grants ? `
            <div>
              <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--ed-border); padding-bottom:0.5rem;">
                Proyectos y Financiación Competitiva
              </h3>
              <ul style="list-style:none; display:flex; flex-direction:column; gap:12px; color:var(--ed-ink-secondary);">
                ${cv.grants.map(g => `<li style="padding-left:1rem; border-left:2px solid var(--ed-accent);">${g}</li>`).join('')}
              </ul>
            </div>
            ` : ''}

            ${cv.publications ? `
            <div>
              <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--ed-border); padding-bottom:0.5rem;">
                Publicaciones Científicas Seleccionadas
              </h3>
              <ul style="list-style:none; display:flex; flex-direction:column; gap:12px; color:var(--ed-ink-secondary);">
                ${cv.publications.map(p => `<li style="padding-left:1rem; border-left:2px solid var(--ed-border-strong);">${p}</li>`).join('')}
              </ul>
            </div>
            ` : ''}

            ${cv.teaching ? `
            <div>
              <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom:1rem; border-bottom:1px solid var(--ed-border); padding-bottom:0.5rem;">
                Actividad Docente y Dirección
              </h3>
              <ul style="list-style:none; display:flex; flex-direction:column; gap:10px; color:var(--ed-ink-secondary);">
                ${cv.teaching.map(t => `<li>&bull; ${t}</li>`).join('')}
              </ul>
            </div>
            ` : ''}
          </div>
        `;
      }
    });
  </script>
</body>
</html>
